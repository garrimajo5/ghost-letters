name: Release Android

# Релизная сборка: подписанные AAB (для Google Play) и APK (поставить вручную).
# Запуск: вкладка Actions → Release Android → Run workflow, или тег v* (например v0.2.0).
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   — keystore в base64 (base64 -w0 upload.jks)
#   ANDROID_KEYSTORE_PASSWORD — пароль keystore
#   ANDROID_KEY_ALIAS         — алиас ключа (например upload)
#   ANDROID_KEY_PASSWORD      — пароль ключа
# Переменная репозитория API_URL — адрес сервера, например https://ghost.example.com.
# Без секретов сборка всё равно пройдёт, но с отладочной подписью (для проверки, не для магазина).
on:
  push:
    tags: ['v*']
  # Проверка самого workflow в PR, где он меняется (собирается без секретов).
  pull_request:
    paths: ['.github/workflows/release-android.yml']
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Адрес сервера (по умолчанию — переменная API_URL)'
        required: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::Секретов подписи нет — релиз подписан отладочным ключом"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > android/app/upload.jks
          cat > android/key.properties <<PROPS
          storeFile=upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Version
        id: version
        run: |
          name=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF#refs/tags/v}"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          API_URL: ${{ github.event.inputs.api_url || vars.API_URL }}
        run: |
          args="--release --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.code }}"
          if [ -n "$API_URL" ]; then
            args="$args --dart-define=API_URL=$API_URL"
          else
            echo "::warning::API_URL не задан — приложение будет искать сервер на 10.0.2.2:8080 (эмулятор)"
          fi
          flutter build appbundle $args
          flutter build apk $args
          mkdir -p ../dist
          cp build/app/outputs/bundle/release/app-release.aab ../dist/ghost-letters-${{ steps.version.outputs.name }}.aab
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/ghost-letters-${{ steps.version.outputs.name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.version.outputs.name }}
          path: dist/*

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Письма призрака $GITHUB_REF_NAME" --generate-notes
