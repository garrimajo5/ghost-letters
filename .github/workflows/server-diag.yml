name: Server diagnostics

# Только чтение: состояние контейнеров, место на диске, память и ошибки из логов API — аннотациями.
# Запускается пушем в ветку diag/** (или вручную).
on:
  push:
    branches: ['diag/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      SSH_USER: ${{ vars.DEPLOY_USER || 'root' }}
      APP_DIR: /opt/ghost-letters
    steps:
      - name: Collect
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts
          note() { tail -c 3800 <<< "$2" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | sed "s/^/::warning title=$1::/"; }
          run() { timeout 90 ssh -i ~/.ssh/deploy "$SSH_USER@$HOST" "cd $APP_DIR && $1" 2>&1 || true; }
          note "who" "$(run "docker ps -a --no-trunc --format '{{.ID}} {{.Names}}' | grep fe11b94; docker inspect -f '{{.Name}} {{.HostConfig.LogConfig}}' fe11b94bcbf4 2>&1")"
          note "spam" "$(run "tail -c 4000 /var/lib/docker/containers/fe11b94bcbf4a4179e251a4558f3cdf363597d0fc4bf04b83817575e711360da/*-json.log | cut -c1-400 | tail -8")"
          note "spam-head" "$(run "head -c 300000000 /var/lib/docker/containers/fe11b94bcbf4a4179e251a4558f3cdf363597d0fc4bf04b83817575e711360da/*-json.log | tail -c 3000 | cut -c1-400")"
