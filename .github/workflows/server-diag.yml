name: Server diagnostics

# Только чтение: состояние контейнеров, место на диске, память и ошибки из логов API — аннотациями.
# Запускается пушем в ветку diag/** (или вручную).
on:
  push:
    branches: ['diag/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      SSH_USER: ${{ vars.DEPLOY_USER || 'root' }}
      APP_DIR: /opt/ghost-letters
    steps:
      - name: Collect
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts
          note() { tail -c 3800 <<< "$2" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | sed "s/^/::warning title=$1::/"; }
          run() { ssh -i ~/.ssh/deploy "$SSH_USER@$HOST" "cd $APP_DIR && $1" 2>&1 || true; }
          note "disk" "$(run "df -h /; docker system df; du -xsh /var/lib/docker/* /var/log /var/lib/docker/containers/* /root /tmp 2>/dev/null | sort -h | tail -15; journalctl --disk-usage 2>/dev/null")"
          note "volumes" "$(run "docker system df -v 2>/dev/null | sed -n '/VOLUME NAME/,/^$/p'; docker images --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}} {{.CreatedSince}}' | head -30")"
          note "postgres" "$(run "docker compose -f docker-compose.prod.yml logs --no-color --tail 25 postgres")"
          note "api-errors" "$(run "docker compose -f docker-compose.prod.yml logs --no-color --since 24h api | grep -iE -A4 'fail|exception|unhandled' | grep -viE 'password|token|api-key|secret' | tail -60")"
