name: Release server image

# Образ сервера для продакшена: ghcr.io/<владелец>/ghost-letters-api:latest и :<sha>.
on:
  push:
    branches: [main]
    paths:
      - server/**
      - .github/workflows/release-server.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ghost-letters-api"
          docker build -t "$image:latest" -t "$image:${GITHUB_SHA::7}" ./server
          docker push "$image:latest"
          docker push "$image:${GITHUB_SHA::7}"
          echo "::notice title=Образ опубликован::$image:${GITHUB_SHA::7}"
