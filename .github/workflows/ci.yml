name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: server/global.json

      - name: Restore
        run: dotnet restore GhostLetters.sln

      - name: Build
        run: dotnet build GhostLetters.sln -c Release --no-restore

      - name: Test
        run: dotnet test GhostLetters.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"

      - name: Annotate failed tests
        if: failure()
        working-directory: .
        run: python3 .github/scripts/trx_annotations.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: server/tests/**/TestResults/*.trx

  docker:
    name: Server — Docker image
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ghost-letters-api ./server

      - name: Validate Caddyfile
        run: docker run --rm -e DOMAIN=example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  compose:
    name: Local stack — docker compose smoke
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build

      - name: Smoke
        run: python3 .github/scripts/compose_smoke.py http://localhost:8080

      - name: Production proxy network and recovery
        run: python3 .github/scripts/proxy_network_smoke.py

      - name: API logs on failure
        if: failure()
        run: |
          docker compose logs api --no-color | tail -40 | while IFS= read -r line; do
            echo "::error title=api log::${line//%/%25}"
          done

      - name: Stop
        if: always()
        run: docker compose down -v

  tools:
    name: Tools — cards cutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy scipy
      - run: python -m unittest discover -s tools/cards -p "test_*.py" -v
      - run: shellcheck deploy/android-signing.sh
      - run: python -m unittest discover -s deploy -p "test_*.py" -v
      - run: node --test deploy/test-download.mjs

  client:
    name: Client — analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          status=$?
          cat analyze.txt
          python3 ../.github/scripts/flutter_annotations.py analyze analyze.txt
          exit $status

      - name: Test
        run: |
          set +e
          flutter test --file-reporter json:test-results.json
          status=$?
          python3 ../.github/scripts/flutter_annotations.py tests test-results.json
          exit $status

  client-web:
    name: Client — web build & smoke
    runs-on: ubuntu-latest
    needs: client
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web
        run: flutter build web --release

      - name: Board zoom in Chrome
        run: flutter test --platform chrome test/board_zoom_test.dart
        timeout-minutes: 5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke in Chromium
        run: |
          pip install playwright >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
          (cd build/web && python -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          python ../.github/scripts/web_smoke.py http://localhost:8000/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-smoke
          path: client/web-smoke.png

  client-android:
    name: Client — Android debug build
    runs-on: ubuntu-latest
    needs: client
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug

