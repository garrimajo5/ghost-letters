name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: server/global.json

      - name: Restore
        run: dotnet restore GhostLetters.sln

      - name: Build
        run: dotnet build GhostLetters.sln -c Release --no-restore

      - name: Test
        run: dotnet test GhostLetters.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: server/tests/**/TestResults/*.trx

  docker:
    name: Server — Docker image
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ghost-letters-api ./server

  tools:
    name: Tools — cards cutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python -m unittest discover -s tools/cards -p "test_*.py" -v
