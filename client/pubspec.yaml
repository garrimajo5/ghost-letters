name: ghost_letters
description: Письма призрака — клиент для Android и iPhone.
publish_to: none
version: 0.1.1+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  signalr_netcore: ^1.4.0
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  record: ">=5.1.2 <7.0.0"
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  web: ^1.1.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/cards/
    - assets/images/

  # Шрифты дизайна (SIL Open Font License): скачаны workflow «Fetch fonts».
  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-400.ttf
        - asset: assets/fonts/Oswald-500.ttf
          weight: 500
        - asset: assets/fonts/Oswald-600.ttf
          weight: 600
        - asset: assets/fonts/Oswald-700.ttf
          weight: 700
    - family: GolosText
      fonts:
        - asset: assets/fonts/GolosText-400.ttf
        - asset: assets/fonts/GolosText-500.ttf
          weight: 500
        - asset: assets/fonts/GolosText-600.ttf
          weight: 600
        - asset: assets/fonts/GolosText-700.ttf
          weight: 700
