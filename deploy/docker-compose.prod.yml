# Продакшен: Caddy (HTTPS от Let's Encrypt) → API → PostgreSQL.
# Настройки — в файле .env рядом (образец — .env.example).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ghost_letters
      POSTGRES_USER: ghost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghost -d ghost_letters"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${API_IMAGE:-ghcr.io/garrimajo5/ghost-letters-api:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=ghost_letters;Username=ghost;Password=${POSTGRES_PASSWORD}"
      Database__MigrateOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?задайте JWT_SIGNING_KEY в .env (не короче 32 символов)}
      Cards__ManifestPath: /app/cards/cards.json
      Media__StoragePath: /app/data/media
      RateLimit__AuthPerMinute: ${AUTH_PER_MINUTE:-30}
      Proxy__KnownProxies: "172.29.214.2"
      Admin__UserIds: ${ADMIN_USER_IDS:-}
      Speech__ApiKey: ${YANDEX_SPEECHKIT_API_KEY:-}
      Speech__FolderId: ${YANDEX_FOLDER_ID:-}
      LiveKit__ApiKey: ${LIVEKIT_API_KEY:-}
      LiveKit__ApiSecret: ${LIVEKIT_API_SECRET:-}
      LiveKit__PublicUrl: wss://livekit.${DOMAIN}
      LiveKit__InternalUrl: http://livekit:7880
    volumes:
      - ./cards.json:/app/cards/cards.json:ro
      - ./tags.json:/app/cards/tags.json:ro
      - ./details.json:/app/cards/details.json:ro
      - ./associations.json:/app/cards/associations.json:ro
      - ./names.json:/app/cards/names.json:ro
      - media:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default: {}
      # API starts before Caddy; automatic allocation could take Caddy's trusted IP.
      edge:
        ipv4_address: 172.29.214.3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      edge:
        ipv4_address: 172.29.214.2

  # Живой голосовой чат (WebRTC SFU). Сигнализация — через Caddy (wss://livekit.ДОМЕН), звук — напрямую:
  # 7881/tcp и 7882/udp. Ключи — LIVEKIT_API_KEY/SECRET в .env (создаются при первом деплое).
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret-devsecret-devsecret-devsecret}"
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      edge:
        ipv4_address: 172.29.214.4

networks:
  edge:
    ipam:
      config:
        - subnet: 172.29.214.0/29

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
