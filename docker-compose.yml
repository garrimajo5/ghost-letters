services:
  postgres:
    image: postgres:16-alpine
    # Поднимается сам после перезагрузки компьютера, когда стартует Docker Desktop.
    restart: unless-stopped
    environment:
      POSTGRES_DB: ghost_letters
      POSTGRES_USER: ghost
      POSTGRES_PASSWORD: ghost
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghost -d ghost_letters"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=ghost_letters;Username=ghost;Password=ghost"
      Cards__ManifestPath: /app/cards/cards.json
      Media__StoragePath: /app/data/media
    ports:
      - "8080:8080"
    volumes:
      - ./client/assets/cards/cards.json:/app/cards/cards.json:ro
      - ./client/assets/cards/tags.json:/app/cards/tags.json:ro
      - media:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  media:
